# @package _global_
training:
  task_name: Cod2026JoystickFlat
  sim_backend: mujoco
  device: cuda
  play_steps: 500
  play_env_num: 4
  render_spacing: 0.0
  cam_tracking: true
  cam_tracking_env_idx: 0
  cam_tracking_extra_envs: 3

interactive:
  action_mode: policy
  policy_obs_mode: auto
  camera_follow_body: true
  use_env_visual_model: false

algo:
  num_envs: 1024
  num_steps_per_env: 48
  max_iterations: 1000
  empirical_normalization: false
  obs_groups:
    actor: [actor]
    critic: [actor]
  policy:
    init_noise_std: 1.0
    actor_hidden_dims: [256, 256]
    critic_hidden_dims: [256, 256]
    activation: elu
    class_name: ActorCritic
  algorithm:
    learning_rate: 1.0e-3
    entropy_coef: 0.001

env:
  scene:
    model_file: src/unilab/assets/robots/cod_2026_balance/scene_flat.xml
  sim_dt: 0.002
  ctrl_dt: 0.02
  sensor:
    gyro: gyro
    accel: accel
    local_linvel: local_linvel
    upvector: upvector
  commands:
    vel_limit:
      - [-1, 0, -1]
      - [1, 0, 1]
    height_limit:
      - 0.30
      - 0.34
    resampling_time: 10.0
    rel_standing_envs: 0.0   # 从 0.1 改为 0：所有环境都要动，不允许"站着不动"
  control_config:
    leg_kp: [40, 40, 40, 40]
    leg_kd: [1, 1, 1, 1]
    wheel_kd: [1.4, 1.4]
    action_scale: 0.5
    wheel_action_scale: 10.0
    clip_actions: 1.0
    simulate_action_latency: false
  domain_rand:
    randomize_base_mass: true
    added_mass_range: [-1.5, 1.5]
    randomize_ground_friction: true
    ground_friction_multiplier_range: [0.7, 1.3]
    randomize_dof_armature: true
    dof_armature_multiplier_range: [0.9, 1.1]
    push_robots: true
    push_interval_initial: 400
    push_interval_final: 400
    max_force: [8.0, 8.0, 10]
    leg_max_force: [ 3.0, 3.0, 1]
    push_body_name: "base"
    # ---- 课程学习：从 step=warmup 开始从 initial_scale 增长到 full_steps 时达到 1.0 ----
    curriculum_enabled: true
    curriculum_warmup_steps: 0        # 前 4800 步用最小扰动，50个Learning iteration
    curriculum_full_steps: 15600          # 2400步每100个Learning iteration）
    curriculum_initial_scale: 0.2         # 初始扰动强度：只有 5% 的最大力
    curriculum_shape: "smooth"             # linear / smooth / quadratic
reward:
  scales:
    # 主任务：动起来得分最高（量级：1）
    tracking_lin_vel: 0.0
    tracking_direction: 0.0
    tracking_ang_vel: 0.0
    base_height: 0.0
    wheel_target: 3.0
    alive: 0.0
    good: 0.0             # 三条件各1/3：tilt<10° + |base_z-tg|<2.5cm + |swing|<6.5°，函数返回[0,1]，日志值=[0,3]
    roll_on_turn: -0.0   # 转向时 roll 惩罚：|cmd_ang| × |roll|，防止越按越斜
    termination: -00.0
    fail_count: -0.0
    # 保持状态：只是微调，惩罚远小于奖励（量级：0.1~0.5）
    orientation: -0
    lin_vel_z: -0
    ang_vel_xy: -0.0
    # Cod2026 特有
    swing_vertical: -0.0
    swing_symmetry: -0.0
    swing_vel: -0.0
    action_rate: -0.02
    dof_torques_l2: -0.0001
    dof_acc_l2: -2.5e-6
    joint_power: -0.0001