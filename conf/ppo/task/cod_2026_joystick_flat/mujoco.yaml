# @package _global_
training:
  task_name: Cod2026JoystickFlat
  sim_backend: mujoco
  play_steps: 1000
  play_env_num: 16
  render_spacing: 0.0
  cam_tracking: true
  cam_tracking_env_idx: 0
  cam_tracking_extra_envs: 3

interactive:
  action_mode: policy
  policy_obs_mode: auto
  camera_follow_body: true
  use_env_visual_model: false

algo:
  num_envs: 1024
  num_steps_per_env: 48
  max_iterations: 1000
  empirical_normalization: true
  obs_groups:
    actor: [actor]
    critic: [actor]
  policy:
    init_noise_std: 1.0
    actor_hidden_dims: [256, 256]
    critic_hidden_dims: [256, 256]
    activation: elu
    class_name: ActorCritic
  algorithm:
    learning_rate: 3.0e-4
    entropy_coef: 1.0e-2

env:
  scene:
    #model_file: src/unilab/assets/robots/cod_2026_balance/scene_flat.xml
    #model_file: src/unilab/assets/robots/cod_2026_balance/scene_rough.xml
    model_file: src/unilab/assets/robots/cod_2026_balance/scene_crawl_slope.xml
  sim_dt: 0.002
  ctrl_dt: 0.02
  sensor:
    gyro: gyro
    accel: accel
    local_linvel: local_linvel
    upvector: upvector
  commands:
    vel_limit:
      - [-1.5, 0, -1.0]
      - [1.5, 0, 1.0]
    height_limit:
      - 0.28
      - 0.36
    resampling_time: 10.0
    rel_standing_envs: 0.0   # 所有环境都要动，不允许"站着不动"
  control_config:
    leg_kp: [40, 40, 40, 40]
    leg_kd: [2.0, 2.0, 2.0, 2.0]
    wheel_kd: [1.0, 1.0]
    action_scale: 0.5
    wheel_action_scale: 15.0
    clip_actions: 1.0
    simulate_action_latency: false
  domain_rand:
    randomize_base_mass: true
    added_mass_range: [-1.5, 1.5]
    randomize_ground_friction: true
    ground_friction_multiplier_range: [0.6, 1.4]
    randomize_dof_armature: true
    dof_armature_multiplier_range: [0.9, 1.1]
    push_robots: true
    push_interval_initial: 400
    push_interval_final: 400
    max_force: [50.0, 50.0, 20.0]
    leg_max_force: [ 80.0, 80.0, 10.0]
    push_body_name: "base"
    # ---- 课程学习：从 step=warmup 开始从 initial_scale 增长到 full_steps 时达到 1.0 ----
    curriculum_enabled: true
    curriculum_warmup_steps: 1200        # 前 4800 步用最小扰动，50个Learning iteration
    curriculum_full_steps: 15600          # 2400步每100个Learning iteration）
    curriculum_initial_scale: 0.2         # 初始扰动强度：只有 5% 的最大力
    curriculum_shape: "smooth"             # linear / smooth / quadratic
reward:
  scales:
    # ── 正奖励（优先级 1：高度 > 主任务） ─────────
    base_height: 1.0
    body_accel_tracking: 0.4
    wheel_target: 0.5
    tracking_lin_vel: 0.8
    tracking_ang_vel: 0.65
    tracking_lin_vel_pbrs: 5.0
    tracking_ang_vel_pbrs: 2.5
    alive: 0.0
    # ── 惩罚 1：倾斜 ───────────────
    # 10°→fn=0.03→-0.003/step；20°→fn=0.117→-0.012/step；30°→fn=0.25→-0.025/step
    orientation: -20.0
    wheel_slip: -0.6
    vertex_clearance: -0.15

    # ── 惩罚 3：摆角 ───────────────
    swing_vertical: -0.1
    swing_vel: -0.02
    swing_symmetry: -1.1

    # ── 惩罚 4：运动抖动（量级 ≤ 正奖励 5%） ───
    lin_vel_z: -0.16
    ang_vel_xy: -0.2
    roll_on_turn: -0.20

    # ── 惩罚 5：平滑 / 能耗（最小） ───────────
    action_rate: -0.05
    dof_torques_l2: -1.0e-6
    dof_acc_l2: -1.0e-7
    joint_power: -1.0e-5


  tracking_sigma: 0.25
  tracking_sigma_lin: 0.07      # 高斯形式：0.5m/s误差拿37%，0.25m/s拿61%，0.1m/s拿85%
  tracking_sigma_ang: 0.5
  base_height_sigma: 0.035        # 高度奖励 σ：6cm 偏拿 37%
  vertex_clearance_target: 0.10   # 离地间隙：0.1m 以上拿满
  vertex_clearance_sigma: 0.03    # 离地间隙 σ：低3cm拿37%
  # orientation_stand 的启阈值（从 YAML 可调）
  stand_cmd_linvel_threshold: 0.2
  stand_cmd_angvel_threshold: 0.2
  stand_tilt_threshold: 0.192  # ≈11°