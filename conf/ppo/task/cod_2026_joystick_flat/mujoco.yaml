# @package _global_
training:
  task_name: Cod2026JoystickFlat
  sim_backend: mujoco
  play_steps: 1000
  play_env_num: 16
  render_spacing: 0.0
  cam_tracking: true
  cam_tracking_env_idx: 0
  cam_tracking_extra_envs: 3

interactive:
  action_mode: policy
  policy_obs_mode: auto
  camera_follow_body: true
  use_env_visual_model: false

algo:
  num_envs: 1024
  num_steps_per_env: 24
  max_iterations: 1000
  empirical_normalization: true
  obs_groups:
    actor: [actor]
    critic: [actor]
  policy:
    init_noise_std: 0.6
    actor_hidden_dims: [256, 256]
    critic_hidden_dims: [256, 256]
    activation: elu
    class_name: ActorCritic
  algorithm:
    learning_rate: 3.0e-4
    entropy_coef: 5.0e-3

env:
  scene:
    #model_file: src/unilab/assets/robots/cod_2026_balance/scene_flat.xml
    #model_file: src/unilab/assets/robots/cod_2026_balance/scene_rough.xml
    #model_file: src/unilab/assets/robots/cod_2026_balance/scene_flat_slope.xml
    model_file: src/unilab/assets/robots/cod_2026_balance/scene_rough_slope.xml
    #model_file: src/unilab/assets/robots/cod_2026_balance/scene_step.xml
    #model_file: src/unilab/assets/robots/cod_2026_balance/scene_crawl_slope.xml
  sim_dt: 0.002
  ctrl_dt: 0.02
  sensor:
    gyro: gyro
    accel: accel
    local_linvel: local_linvel
    upvector: upvector
  commands:
    vel_limit:
      - [-2.5, 0, -2.0]
      - [2.5, 0, 2.0]
    cmd_curriculum_enabled: true  
    initial_vel_range: [-0.2, 0.2]  # 初始速度范围，用于课程学习
    height_limit:
      - 0.29
      - 0.42
    resampling_time: 6.0
    rel_standing_envs: 0.0   # 站着不动
  control_config:
    leg_kp: [80, 80, 80, 80]
    leg_kd: [4.0, 4.0, 4.0, 4.0]
    wheel_kd: [2.0, 2.0]
    action_scale: 0.5
    wheel_action_scale: 50.0
    clip_actions: 1.0
    simulate_action_latency: False
    action_latency_steps: 1         # 1 步延迟（50ms）
  noise_config:
    level: 1.0
    scale_joint_angle: 0.015
    scale_joint_vel: 0.3
    scale_gyro: 0.02
    scale_gravity: 0.02
    scale_linvel: 0.01
  domain_rand:
    randomize_base_mass: true
    added_mass_range: [-2.0, 2.0]
    randomize_ground_friction: true
    ground_friction_multiplier_range: [0.5, 1.5]
    randomize_kp: true
    randomize_kd: true
    kp_multiplier_range: [0.7, 1.3]
    kd_multiplier_range: [0.7, 1.3]
    push_robots: true
    push_interval_initial: 300
    push_interval_final: 300
    max_force: [50.0, 50.0, 25.0]
    leg_max_force: [ 50.0, 50.0, 15.0]
    push_body_name: "base"
    # ---- 课程学习：从 step=warmup 开始从 initial_scale 增长到 full_steps 时达到 1.0 ----
    curriculum_enabled: true
    curriculum_warmup_steps: 000        # 前 4800 步用最小扰动，50个Learning iteration
    curriculum_full_steps: 19200          # 2400步每100个Learning iteration）
    curriculum_initial_scale: 0.0         # 初始扰动强度：只有 5% 的最大力
    curriculum_shape: "smooth"             # linear / smooth / quadratic
reward:
  scales:
    # ── 正奖励（优先级 1：高度 > 主任务） ─────────
    base_height: 2.0
    wheel_target: 0.4
    tracking_lin_vel: 2.0
    tracking_ang_vel: 1.0
    tracking_yaw: 1.0
    tracking_lin_vel_pbrs: 5
    tracking_ang_vel_pbrs: 5
    body_accel_tracking: 0.1
    # ── 下台阶成功离散奖励 ──────
    step_down_success: 0.0
    # ── 离散奖励：tilt<8° 且 swing<8° ──
    upright_swing_bonus: 2.0
    # ── 惩罚 1：倾斜 ───────────────
    orientation: -36.0
    wheel_slip: -0.2
    vertex_clearance: -1.0

    # ── 惩罚 3：摆角 ───────────────
    swing_vertical: -1.0
    swing_vel: -0.04
    swing_symmetry: -0.6


    # ── 惩罚 4：运动抖动 ───────────
    lin_vel_z: -0.2
    ang_vel_xy: -0.25
    roll_on_turn: -0.3
    # ── 惩罚 6：站立 ──────────────
    stand: -0.2

    # ── 惩罚 5：平滑 ───────────────
    action_rate: -0.03

    # ── 惩罚 7：力矩 ────────
    joint_power: -5.0e-5
    dof_torques_l2: -5.0e-5
    dof_acc_l2: -1.0e-7

  powerless_curriculum_threshold: 0.25 # curriculum progress 超此值启用无力期
  powerless_probability: 0.1          # 无力期概率（从 0.2 降到 0.1）
  powerless_duration: 0.5             # 无力时长 秒（从 1.0 降到 0.5）
  # ── 原地旋转模式 ──────────────────────
  spin_in_place_prob: 0.1            # 进入原地旋转模式的概率（vx=0, yaw=1.5~3.0, 开启stand惩罚）
  # ── 三区域 spawn 概率 ────────────────
  slope_spawn_prob: 0.4              # 斜坡圈 spawn 概率
  rough_spawn_prob: 0.3             # 远处粗糙地形 spawn 概率
  # 平地概率 = 1 - slope_spawn_prob - rough_spawn_prob

  lift_force_max: 0.0  # 初期竖直辅助拉力(N)，随curriculum归零
  tracking_sigma: 0.25
  tracking_sigma_lin: 1.2      # 高斯形式：cmd=0.75时σ=0.6，0.43m/s误差拿60%
  tracking_sigma_ang: 1.1
  tracking_sigma_yaw: 1.1
  base_height_sigma: 0.06         # σ：err=6cm 拿 37%，err=8cm 拿 61%，err=4cm 拿 85%
  vertex_clearance_target: 0.04    # 离地间隙：相对坐标 0.0m 以上拿满 (body最低点≥轮子中心)
  vertex_clearance_sigma: 0.03    # 离地间隙 σ：低3cm拿37%
  stand_cmd_linvel_threshold: 0.2
  stand_cmd_angvel_threshold: 0.2
  stand_tilt_threshold: 0.192  # ≈11°
  stand_vel_weight: 1.0          # 站立惩罚中水平速度项权重
  stand_angvel_weight: 0.5       # 站立惩罚中角速度项权重
  stand_linvelz_weight: 0.5      # 站立惩罚中垂直速度项权重