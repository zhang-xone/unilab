# @package _global_
training:
  task_name: BalanceInfantryJoystickFlat
  sim_backend: mujoco
  play_steps: 200
  play_env_num: 16
  render_spacing: 0.0
  cam_tracking: true
  cam_tracking_env_idx: 0
  cam_tracking_extra_envs: 3
interactive:
  action_mode: policy
  policy_obs_mode: auto
  camera_follow_body: true
  use_env_visual_model: false
algo:
  num_envs: 2048
  num_steps_per_env: 48
  max_iterations: 1000
  obs_history_length: 5
  empirical_normalization: true
  policy:
    init_noise_std: 1.0
    num_encoder_obs: 145
    latent_dim: 3
    encoder_hidden_dims: [128, 64]
    actor_hidden_dims: [128, 64, 32]
    critic_hidden_dims: [256, 128, 64]
    activation: elu
    orthogonal_init: true
    obs_normalization: true
    use_real_vel: false
  algorithm:
    learning_rate: 0.001
    extra_learning_rate: 0.0003
    encoder_grad_norm: 0.1
    entropy_coef: 0.01
    schedule: adaptive
    desired_kl: 0.005
    num_learning_epochs: 5
    num_mini_batches: 4
    gamma: 0.99
env:
  spawn_z_offset: 0.2      # reset 时在 keyframe(z=0.45) 之上再抬高多少米；0.2 → 离地 0.50 m，改了不用重编 .mjb
  spawn_xy_jitter: 0.0     # 0 = 精确落在 keyframe 的 x/y（赛场 -7, 0），不做 ±0.5 抖动
  obs_vel: false
  obs_manual_norm: false
  scene:
    #model_file: src/unilab/assets/robots/balance_infantry/scene_rmuc.xml
    #model_file: src/unilab/assets/robots/balance_infantry/scene_crawl_slope.xml
    #model_file: src/unilab/assets/robots/balance_infantry/scene_flat_slope.xml
    #model_file: src/unilab/assets/robots/balance_infantry/balance_infantry.xml
    #model_file: src/unilab/assets/robots/balance_infantry/scene_flat.xml
    #model_file: src/unilab/assets/robots/balance_infantry/scene_step.xml
    #model_file: src/unilab/assets/robots/balance_infantry/scene_rmuc2027.xml
    # 想换回地形课程：注释掉 model_file 和 visual_model_file，然后把下面 terrain 解开
    terrain:
      generator:
        curriculum: true
        size: [8.0, 8.0]
        num_rows: 6
        num_cols: 6
        border_width: 1.0
        add_lights: true
        horizontal_scale: 0.1
      hfield_name: terrain_hfield
      geom_name: floor
    # terrain: ~
    # fragment_files: []
    # 渲染专用场景(191 个 geom)。不设置则用 model_file 渲染(5.7 万 geom，会卡)
    visual_model_file: src/unilab/assets/robots/balance_infantry/scene_rmuc2027_visual.xml
  terrain_scan:
    enabled: true
    geom_name: floor
    measured_points_x: [-0.3, -0.2, -0.1, 0.0, 0.1, 0.2, 0.3]
    measured_points_y: [-0.1, 0.0, 0.1]
  terrain_curriculum:
    enabled: true
    type_curriculum_enabled: false
    type_curriculum_switch_interval: 100
    type_curriculum_iteration_offset: 0   # 续训设 -当前iter 可从 flat 重头开始
    init_level: 5
    randomize_init_level: true
    promote_frac: 0.3
    demote_frac: 0.1
    spawn_height_margin: 0.05
    curriculum_mode: hybrid   # distance | tracking | hybrid
    tracking_reward_demote_threshold: 0.4
  debug_enabled: true
  sim_dt: 0.01
  ctrl_dt: 0.01
  sensor:
    gyro: gyro
    accel: accel
    local_linvel: local_linvel
    upvector: upvector
  commands:
    vel_limit:
      - [-3.0, 0, -8.0]
      - [3.0, 0, 8.0]
    cmd_curriculum_enabled: true
    jump_curriculum_enabled: false   # 是否开启跳跃 curriculum（独立于 cmd_curriculum_enabled）
    initial_vel_range: [-1.0, 1.0]   # 初始速度范围
    initial_yaw_range: 1.0   # 初始 yaw 范围，随 curriculum 等比扩大至 4.0
    height_limit: [0.18, 0.4]
    resampling_time: 6.0
    rel_standing_envs: 0.1   # 站着不动
    cmd_curriculum_sustain_threshold: 1   # 连续通过次数，默认4，降低加速速度范围扩大
    cmd_curriculum_sustain_threshold_bad: 1   # 连续失败次数才降速，默认同sustain_threshold
    cmd_curriculum_eval_steps: 2000
    cmd_curriculum_min_cmd_speed: 0.5
  control_config:
    wheel_kd: [0.1, 0.1]
    clip_actions: 100.0
    action_delay_range: [1, 3]   # FIFO 随机延迟子步数（sim_dt 每步）
    obs_delay_range: [0, 2]   # 观测延迟（默认跟随 action_delay_range）
    leg_kp: [40, 40, 40, 40]
    leg_kd: [3.0, 3.0, 3.0, 3.0]
    action_scale_joint: 0.5
    action_scale_wheel: 20.0
    wheel_torque_speed:
      enabled: false
      stall_torque: 4.0
    vmc:
      L1: 0.215
      L2: 0.254
      L3: 0.254
      L4: 0.215
      L5: 0.0
      feedforward_force: 80.0
    action_smoothing: 1.0   # 1.0=无滤波
  noise_config:
    level: 1.0
    scale_joint_angle: 0.02
    scale_joint_vel: 1.5
    scale_gyro: 0.2
    scale_gravity: 0.05
    scale_linvel: 0.1
    scale_vmc_phi0: 0.02
    scale_vmc_L0: 0.004
    scale_vmc_phi0_dot: 0.2
    scale_vmc_L0_dot: 0.1
  domain_rand:
    randomize_base_mass: true
    added_mass_range: [-4.0, 2.0]
    randomize_body_mass: true
    body_mass_multiplier_range: [0.9, 1.1]
    random_com: true
    com_offset_x: [-0.04, 0.04]
    com_offset_y: [-0.03, 0.03]
    com_offset_z: [-0.03, 0.03]
    randomize_ground_friction: true
    ground_friction_multiplier_range: [0.4, 1.6]
    randomize_wheel_ground_friction: true
    wheel_ground_friction_range: [0.4, 1.6]
    randomize_geom_solref: true
    geom_solref_timeconst_range: [0.005, 0.04]
    geom_solref_dampratio_range: [0.9, 1.1]
    randomize_vmc_ff: true
    vmc_ff_multiplier_range: [0.95, 1.05]
    randomize_wheel_kd: true
    wheel_kd_multiplier_range: [0.9, 1.1]
    randomize_kp: true
    randomize_kd: true
    kp_multiplier_range: [0.9, 1.1]
    kd_multiplier_range: [0.9, 1.1]
    randomize_motor_torque: true
    torque_scale_range: [0.8, 1.05]
    actuator_noise: false
    actuator_noise_std_range: [0.0, 0.0]
    randomize_inertia: true
    inertia_multiplier_range: [0.9, 1.1]
    randomize_dof_armature: true
    dof_armature_multiplier_range: [0.8, 1.2]
    randomize_joint_friction: true
    damping_multiplier_range: [0.4, 1.2]
    frictionloss_multiplier_range: [0.4, 1.2]
    randomize_default_dof_pos: true
    randomize_default_dof_pos_range: [-0.05, 0.05]
    push_robots: true
    push_interval_initial: 1000
    push_interval_final: 700
    max_force: [50.0, 50.0, 25.0]
    leg_max_force: [50.0, 50.0, 15.0]
    push_body_name: base_link
    curriculum_enabled: true
    curriculum_warmup_steps: 0   # 前 4800 步用最小扰动，50个Learning iteration
    curriculum_full_steps: 9600   # 2400步每100个Learning iteration）800 Learning iteration达到最大
    curriculum_initial_scale: 0.0   # 初始扰动强度：只有 5% 的最大力
    curriculum_shape: smooth   # linear / smooth / quadratic
reward:
  scales:
    base_height_precise: 0.5       # ← jump 版 0.5（原 0.0，开启）
    tilt_precise: 0.5
    tracking_lin_vel: 1.5          # ← jump 版 1.5（原 1.0）
    tracking_ang_vel: 1.0
    tracking_lin_vel_precise: 0.4  # ← jump 版 0.4（原 0.6）
    tracking_lin_vel_quad: -0.3
    tracking_ang_vel_quad: -0.1
    orientation: -25.0
    wheel_slip: -0.05
    collision: -1.0
    base_height: -1.5              # ← jump 版 -1.5（原 -1.0）
    swing_vertical: -1.0           # ← jump 版 -2.0（原 -0.6）
    swing_symmetry: -1.0
    wheel_contact: -0.05
    lin_vel_z: -0.1
    ang_vel_xy: -0.06
    stand: -1.0
    action_rate: -0.01             # ← jump 版 -0.02（原 -0.01）
    action_smooth: -0.02           # ← jump 版 -0.04（原 -0.02）
    dof_torques_l2: -0.0001
    wheel_power: -0.001
    dof_vel: -5.0e-05
    dof_acc: -2.5e-07
  clip_ranges:
    orientation: 100.0
    base_height: 100.0
    lin_vel_z: 100.0
    stand: 100.0
    collision: 100.0
  powerless_curriculum_threshold: 0.25   # curriculum progress 超此值启用无力期
  powerless_probability: 0.15   # 无力期概率（从 0.2 降到 0.1）
  powerless_duration: 2.0   # 无力时长 秒（从 1.0 降到 0.5）
  tilt_precise_sigma: 0.07   # 4°=0.07rad，tilt=4°时奖励=exp(-1)=0.37
  tracking_sigma: 0.25
  tracking_sigma_lin: 0.25
  tracking_sigma_ang: 0.25
  tracking_sigma_yaw: 0.25
  tracking_sigma_dynamic: false   # 静态 σ=0.25，与 Fudan 一致
  wheel_air_power_max: 50.0
  base_height_sigma: 0.12   # σ：err=10cm 拿 37%
  leg_length_sigma: 0.12   # σ：腿长误差2cm拿 37%
  body_corner_clearance_threshold: 0.09   # 角点离地 < 此值（m）开始惩罚
  stand_cmd_linvel_threshold: 0.1
  stand_cmd_angvel_threshold: 0.1
  stand_tilt_threshold: 0.192   # ≈11°
  stand_vel_weight: 1.0   # 站立惩罚中水平速度项权重
  stand_angvel_weight: 0.5   # 站立惩罚中角速度项权重
  stand_linvelz_weight: 0.5   # 站立惩罚中垂直速度项权重
  tilt_limit_tight: 1.4706
  swing_angle_limit: 1.0
  min_height_tight: 0.06
  term_loosen_enabled: true
  term_loosen_from_step: 0
  air_spawn_max_height: 0.5   # 空中出生最大高度（m）
  air_spawn_probability: 0.0      # 空中出生概率，其余从地面出生；赛场测试置 0，保证出生高度唯一
  ground_spawn_max_height: 0.0    # 地面出生最大高度偏移（m）；赛场测试置 0，不再叠加随机抬升
