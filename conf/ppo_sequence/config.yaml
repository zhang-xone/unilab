# @package _global_
defaults:
  - _self_
  - task: balance_infantry_joystick_flat/mujoco

algo:
  algo: ppo_sequence
  algo_log_name: rsl_rl_sequence
  seed: 1
  num_envs: 4096
  num_steps_per_env: 24
  max_iterations: 1500
  save_interval: 100

  experiment_name: test
  run_name: ""
  resume: false
  load_run: "-1"
  checkpoint: -1
  resume_path: null

  runner:
    policy_class_name: ActorCriticSequence
    algorithm_class_name: PPO
    num_steps_per_env: 24
    save_interval: 100

  algorithm:
    num_learning_epochs: 5
    num_mini_batches: 4
    clip_param: 0.2
    gamma: 0.99
    lam: 0.95
    value_loss_coef: 1.0
    entropy_coef: 0.01
    learning_rate: 1.0e-3
    extra_learning_rate: 1.0e-3
    max_grad_norm: 1.0
    use_clipped_value_loss: true
    schedule: fixed
    desired_kl: 0.01
    kl_decay: 0

  policy:
    init_noise_std: 1.0
    num_encoder_obs: 155
    latent_dim: 3
    encoder_hidden_dims: [128, 64]
    actor_hidden_dims: [512, 256, 128]
    critic_hidden_dims: [512, 256, 128]
    activation: elu
    orthogonal_init: false

  obs_groups:
    default:
      - policy

  obs_history_length: 5

training:
  task_name: BalanceInfantryJoystickFlat
  device: null
  logger: tensorboard
  wandb_project: unilab
  wandb_entity: null
  wandb_group: null
  wandb_job_type: null
  wandb_name: null
  wandb_tags: []
  wandb_notes: null
  wandb_mode: null
  sim_backend: mujoco
  nan_guard:
    enabled: false
    buffer_size: 100
    max_envs_to_dump: 5
    output_dir: null
  play_only: false
  no_play: false
  play_render_mode: auto
  play_env_num: 16
  render_spacing: 1.0
  play_steps: 200
  cam_distance: 6.0
  cam_elevation: -20.0
  cam_azimuth: 90.0
  cam_lookat: null
  cam_tracking: false
  cam_tracking_env_idx: 0
  cam_tracking_extra_envs: 2
  log_root: null
  num_timesteps: null
  log_dir: null

interactive:
  action_mode: zero
  policy_obs_mode: auto
  show_target_bodies: false
  show_reward_debug: false
  target_show_axes: false
  target_body_names: ""
  target_max_bodies: 0
  target_marker_radius: 0.02
  target_axis_length: 0.08
  target_marker_alpha: 0.75
  reward_debug_show_velocity: false
  reward_debug_lin_vel_scale: 0.08
  reward_debug_ang_vel_scale: 0.05
  reward_debug_show_connectors: false
  reward_debug_show_global_anchor: false
  camera_follow_body: true
  camera_focus_body_name: ""
  camera_height_offset: 0.15
  camera_distance: null
  camera_elevation: null
  camera_azimuth: null
  use_env_visual_model: true
  speed: 1.0
  start_paused: false
  keyboard: false
  keyboard_step_lin: 0.1
  keyboard_step_ang: 0.2
  mouse_yaw: false
  mouse_yaw_sensitivity: 0.015
  mouse_yaw_decay: 0.85

viser:
  port: 8080
  env_idx: 0
  display_mode: all
  max_envs: 16

env:
  post_step_forward_sensor: false

hydra:
  run:
    dir: .
  output_subdir: null
  job:
    chdir: false
  job_logging:
    root:
      handlers: [console]